audio:
  sample_rate: 16000
  # PulseAudio source name for the ReSpeaker — used by both wake word and STT.
  # Find yours with: pactl list sources short
  # Leave blank to use the PulseAudio default source.
  pulse_source: "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993702260500419-00.multichannel-input"
  output_device_index: null   # sounddevice output index; null = system default

wake_word:
  model_path: "models/wake_word/"
  wake_word: "hey jarvis"
  threshold: 0.5
  pulse_source: "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993702260500419-00.multichannel-input"
  # Lower threshold = more sensitive, higher = fewer false positives
  # "hey jarvis" is a built-in openWakeWord model — replace with custom "hey ivona" once trained

conversation:
  session_timeout_seconds: 30     # silence duration before returning to wake word mode
  session_start_phrase: "Yes?"    # spoken when wake word detected
  session_end_phrase: "Goodbye!"  # spoken when session times out

stt:
  backend: "faster_whisper"        # in-process, model loaded once at startup (~1.8s load, ~0.1s inference)
  model_size: "base"               # base=142MB CPU; small=466MB if accuracy insufficient
  model_dir: "models/STT/"
  language: "en"
  device: "cpu"                    # CTranslate2 aarch64 PyPI wheel is CPU-only (no CUDA)
  compute_type: "int8"
  pulse_source: "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993702260500419-00.multichannel-input"
  silence_threshold_seconds: 1.5   # used by fallback record_until_silence() only
  # whisper_cpp fallback (kept for reference — use if faster_whisper accuracy is insufficient)
  whisper_cpp_binary: "whisper.cpp/build/bin/whisper-cli"
  whisper_cpp_model: "models/STT/ggml-base.en.bin"
  # VAD settings (webrtcvad — used in conversation session mode)
  vad:
    aggressiveness: 3              # 0=least aggressive, 3=most aggressive noise filtering
    speech_pad_ms: 300             # pre-roll buffer captured before speech onset
    end_silence_ms: 900            # silence duration that ends an utterance

llm:
  backend: "llama_cpp_python"     # "llama_cli" (subprocess) or "llama_cpp_python"
  model_path: "models/LLM/gemma_4/google_gemma-4-E2B-it-Q4_K_M.gguf"
  chat_format: "gemma"            # "chatml" for Qwen/Mistral, "gemma" for Gemma models
  n_gpu_layers: 99                # 2B model fits entirely on GPU — offload all layers
  max_history_turns: 5            # sliding window of prior turns included in context
  # To switch back to Qwen2.5-7B:
  #   model_path: "models/LLM/qwen_2_5/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf"
  #   chat_format: "chatml"
  #   n_gpu_layers: 20
  context_length: 2048
  max_tokens: 512
  temperature: 0.7
  system_prompt: >
    You are Ivona, a friendly and knowledgeable AI assistant at the AI Conference for Good.
    You answer questions about artificial intelligence and how it can benefit society.
    Keep your answers concise and conversational — visitors are standing and listening.
    If you don't know something, say so honestly.

tts:
  binary_path: "services/piper/piper/piper"
  model_path: "models/TTS/en_US-amy-medium.onnx"
  speaking_rate: 1.0

logging:
  level: "INFO"
  file: "logs/ivona.log"
